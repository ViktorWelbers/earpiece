name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded PR runs are pointless; keep main's runs so every commit reports.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # fails if uv.lock drifted from pyproject.toml
      - run: uv lock --check

  # macOS only, on purpose: earpiece requires macOS (README "Requires macOS" —
  # CoreAudio, a BlackHole loopback, `say`/`afconvert`). Cross-platform support
  # is a non-goal, so a green Linux leg would prove nothing a user relies on.
  # The matrix varies Python instead, to back the `requires-python = ">=3.12"`.
  test:
    runs-on: namespace-profile-viktor-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            coverage: true
          - python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync
      - if: ${{ !matrix.coverage }}
        run: uv run pytest -q
      - if: ${{ matrix.coverage }}
        run: uv run pytest -q --cov=earpiece --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # earpiece ships as a uv tool with a console script; a broken build
      # wouldn't show up in any test. Safe on Linux: the wheel is py3-none-any
      # and ruff is static, so neither job touches macOS-specific paths.
      - run: uv build
